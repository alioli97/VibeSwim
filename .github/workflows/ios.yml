name: iOS

# Builds the iOS app on macOS runners (there is no local Mac).
# - On PRs and pushes to master: unsigned build, to check that the iOS project
#   compiles and that the localized Info.plist strings end up in the bundle.
# - Run manually ("Run workflow"): signed archive uploaded to TestFlight.
#   The archive is signed for development with automatic signing through the
#   App Store Connect API key (it needs one registered device). The export
#   re-signs it for distribution on the runner with our own Apple Distribution
#   certificate and App Store profile: Apple's cloud-managed distribution
#   signing writes the accented certificate name ("Alió") in a different
#   Unicode form than the certificate, and App Store Connect rejects the
#   signature (ITMS-90035).
#   Secrets: APPSTORE_API_KEY (.p8 contents), APPSTORE_KEY_ID,
#   APPSTORE_ISSUER_ID, APPLE_TEAM_ID, IOS_DIST_P12_BASE64,
#   IOS_DIST_P12_PASSWORD, IOS_APPSTORE_PROFILE_BASE64. See docs/RELEASE.md, "iOS".

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ios/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS (unsigned)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Check localized resources in the bundle
        run: |
          app=build/ios/iphoneos/Runner.app
          for lang in en es ca; do
            test -f "$app/$lang.lproj/InfoPlist.strings" || {
              echo "::error::Missing $lang.lproj/InfoPlist.strings in the app bundle"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$app/Info.plist"

  testflight:
    name: Sign and upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write the App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Missing App Store Connect secrets (see docs/RELEASE.md)."; exit 1
          fi
          # altool looks for the key in ~/private_keys/AuthKey_<id>.p8.
          mkdir -p ~/private_keys
          printf '%s\n' "$API_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Generate the Flutter build configuration
        # TestFlight needs a new build number on every upload; the run number
        # of this workflow always grows. The version name comes from pubspec.yaml.
        # --no-codesign: xcodebuild signs below with the API key.
        run: |
          build_number=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          flutter build ios --release --config-only --no-codesign --build-number=$build_number

      - name: Archive (signed)
        # Automatic signing signs the archive with a development profile, which
        # Apple only issues when the team has at least one registered device
        # (docs/RELEASE.md, "iOS"). The export step re-signs it for distribution.
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Install the distribution certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Missing the distribution certificate or profile secrets (see docs/RELEASE.md)."; exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          profile="$RUNNER_TEMP/appstore.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$dir" && cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Export the IPA (distribution signing on the runner)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alioli97.swimvibe</key><string>$PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Check the signature of the IPA
        # Catches the signature problems App Store Connect would reject.
        run: |
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          unzip -q "$(ls "$RUNNER_TEMP"/ipa/*.ipa)"
          app=$(ls -d Payload/*.app)
          codesign -dvv "$app" 2>&1 | grep -m1 Authority
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa)" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
